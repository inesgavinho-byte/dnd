[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# Astro generates pretty URLs (e.g. /about/index.html). Netlify serves these
# automatically; no explicit redirect rules required.

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/paper-grain.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
